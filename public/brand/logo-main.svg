<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="100%" height="100%">
  <defs>
    <!-- Purple to Cyan Gradient -->
    <linearGradient id="prozGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Glass Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Metallic/Glass Accent -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Cyan Text Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- P/Play Combined Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Hexagonal/Rounded Shield with Glass Depth -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="#111827" stroke="#334155" stroke-width="2" />
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#glassShine)" opacity="0.15" />
    
    <!-- Outer Glow Rim -->
    <rect x="2" y="2" width="76" height="76" rx="18" fill="none" stroke="url(#prozGrad)" stroke-width="1.5" opacity="0.7" />

    <!-- Stylized P with Play Triangle -->
    <path d="M 24 18 
             L 48 18 
             C 60 18, 64 26, 64 36 
             C 64 46, 58 52, 48 52 
             L 34 52 
             L 34 62 
             L 24 62 
             Z" 
          fill="url(#prozGrad)" 
          filter="url(#neonGlow)" />
          
    <!-- Negative Space Play Triangle inside P loop -->
    <path d="M 36 28 
             L 36 44 
             L 50 36 
             Z" 
          fill="#080B12" />

    <!-- Cyan Play Arrow Accent nested inside -->
    <path d="M 38 31 
             L 38 41 
             L 46 36 
             Z" 
          fill="url(#cyanGrad)" />
  </g>

  <!-- Brand Typography -->
  <!-- "PROZ" in pure white futuristic heavy sans -->
  <text x="105" y="58" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" letter-spacing="3" fill="#F8FAFC">PROZ</text>
  
  <!-- "MOVIE" in neon cyan glowing accent -->
  <text x="245" y="58" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="40" letter-spacing="4" fill="url(#cyanGrad)" filter="url(#neonGlow)">MOVIE</text>

  <!-- Tagline / Secondary Label -->
  <text x="107" y="78" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10.5" letter-spacing="6" fill="#94A3B8" opacity="0.9">STREAM YOUR WORLD</text>
  
  <!-- Decorative Accent Pill Dot -->
  <circle cx="395" cy="50" r="3.5" fill="#8B5CF6" />
</svg>
